appId: com.visualalgos.app
productName: Visual Algos
directories:
  buildResources: build
  output: dist
# Auto-update feed. electron-builder uploads installers + update metadata
# (latest*.yml, blockmaps) to the matching GitHub Release when publishing.
publish:
  provider: github
  owner: JorgeOchoaReyes
  repo: visual-algos
  # Publish assets directly to a full (non-draft) release so they attach even
  # when the release/tag already exists, and so auto-update can see it.
  releaseType: release
files:
  - "out/**/*"
  - "package.json"
# The bundled Python + Manim runtime is copied verbatim into the app's
# resources dir (outside the asar, so its binaries stay executable). At runtime
# it lives at process.resourcesPath/pyruntime.
extraResources:
  - from: "resources/pyruntime"
    to: "pyruntime"
    filter: ["**/*"]
  # Runtime copy of the icon for the app window (Linux especially).
  - from: "build/icon.png"
    to: "icon.png"
  # Deterministic Manim walkthrough renderer.
  - from: "resources/render"
    to: "render"
    filter: ["**/*"]
mac:
  category: public.app-category.education
  target:
    - dmg
    - zip
win:
  target:
    - nsis
linux:
  target:
    - AppImage
  category: Education
